 if(n==1){
  return t+`<div class="card">
   <h3>LINE連携設定</h3>
   <div class="fm">
    <label>チャネルID<input value="（未設定）" readonly></label>

    <label class="w">チャネルアクセストークン<input value="（未設定）" readonly></label>
   </div>
   <div class="bar" style="margin-top:10px"><button class="btn s">接続テスト</button></div>
   <small style="color:var(--mut)">GAS接続は別途実装予定。</small>
  </div>`;
 }
 return t+`<div class="card">
  <h3>メール送信設定</h3>
  <div class="fm">
   <label>送信者名<input value="MST 大橋真人"></label>
   <label>返信先<input value="mst.shikumikaizen@gmail.com"></label>

 </div>`}};
function send(u){const v=$('#ci').value.trim();if(v){C[u].push(['out',v]);go()}}

function rich(){const M=['AI経営診断','介護保険外サービス開業相談','LINE相談','個別相談'];
 return `<p style="color:var(--mut);margin-top:0">LINEトーク画面の下部メニューから、各フォームへの導線を管理します(UIのみ・仮表示)。</p><div class="g2"><div class="card"><h3>メニュープレビュー ${B('準備中')}</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:320px">${M.map(m=>`<div style="background:var(--prib);color:var(--pri);border-radius:6px;padding:22px 8px;text-align:center;font-size:13px">${esc(m)}</div>`).join('')}</div></div><div class="card"><h3>タップ時の遷移先(フォーム)</h3>${M.map(m=>{const i=FORMS.findIndex(f=>f.n==m);return i<0?'':`<div class="li" onclick="editForm(${i})"><span>${esc(m)}</span><em>${esc(FORMS[i].flow)}</em></div>`}).join('')}</div></div>`}
const AUTO=[{n:'介護開業シナリオ開始',tag:'介護保険外サービス開業',st:'',act:'介護開業シナリオを開始',on:'有効'},{n:'経営改善シナリオ開始',tag:'経営改善',st:'',act:'経営改善シナリオを開始',on:'有効'},{n:'LINE相談の案内',tag:'LINE相談',st:'',act:'LINE相談用の案内を開始',on:'有効'},{n:'経営改善フォロー',tag:'経営改善',st:'追客中',act:'メールステップ配信を開始',on:'無効'}];
const ACTS=['介護開業シナリオを開始','経営改善シナリオを開始','LINE相談用の案内を開始','LINEステップ配信を開始','メールステップ配信を開始'];
function ruleCond(a){return 'サービス区分 = '+B(a.tag)+(a.st?' かつ リードステータス = '+B(a.st):'')}
function ruleCnt(a){return E.leads.d.filter(r=>(!a.tag||r.サービス区分==a.tag)&&(!a.st||r.リードステータス==a.st)).length}
function editRule(i){const nw=i<0,a=nw?{n:'',tag:TAGS[0],st:'',act:ACTS[0],on:'有効'}:AUTO[i];
 const sel=(id,o,v)=>`<select id="${id}">${o.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('')}</select>`;
 dr.innerHTML=`<div class="bar" style="justify-content:space-between"><h3>自動化ルール${nw?'の追加':'の設定'}</h3><button class="btn s" onclick="cl()">閉じる</button></div><div class="card"><div class="fm"><label>ルール名<input id="a_n" value="${esc(a.n)}"></label><label>状態${sel('a_on',['有効','無効'],a.on)}</label></div></div><div class="card"><h3>条件(すべて満たす場合)</h3><div class="fm"><label>サービス区分(タグ)${sel('a_tag',TAGS,a.tag)}</label><label>リードステータス(任意)<select id="a_st">${['',...E.leads.opts.リードステータス].map(x=>`<option${x==a.st?' selected':''}>${x}</option>`).join('')}</select></label></div><div class="bar" style="margin-top:10px"><button class="btn s" disabled>＋ その他の条件(準備中)</button></div></div><div class="card"><h3>アクション</h3>${sel('a_act',ACTS,a.act)}</div><small style="color:var(--mut)">ルール専用のシートは作りません。条件には既存のリード管理の項目を使います。</small><div class="bar" style="margin-top:10px"><button class="btn" onclick="saveRule(${i})">保存(仮データ)</button><button class="btn s" onclick="cl()">キャンセル</button></div>`;ov.style.display='block'}
function saveRule(i){const n=$('#a_n').value.trim();if(!n){$('#a_n').focus();return}const a={n,tag:$('#a_tag').value,st:$('#a_st').value,act:$('#a_act').value,on:$('#a_on').value};if(i<0)AUTO.push(a);else AUTO[i]=a;cl();go()}
const SCEN=[
{ch:'経営改善について相談',tag:'経営改善',sc:'経営改善シナリオ',guide:'AI経営診断などを案内'},
{ch:'介護保険外サービスを開業したい',tag:'介護保険外サービス開業',sc:'介護開業シナリオ',guide:'介護保険外サービス開業相談フォームを案内'},
{ch:'まずLINEで相談したい',tag:'LINE相談',sc:'LINE相談用の案内',guide:'必要に応じてリード登録・予約'}];
function first(){return `<div class="card"><h3>友だち追加時の初回選択 ${B('仮表示')}</h3><p style="color:var(--mut);margin-top:0">選んだ時点でサービス区分(タグ)を付与し、その値でシナリオを分岐します。タグはリード管理の「サービス区分」を使い、タグ用シートは作りません。</p><div class="flow"><i>友だち追加</i>→<i>三択</i>→<i>サービス区分を付与</i>→<i>シナリオ開始</i></div><div class="tw"><table><tr><th>選択肢</th><th>付与するサービス区分</th><th>開始するシナリオ</th><th>案内</th></tr>${SCEN.map(c=>`<tr><td>${esc(c.ch)}</td><td>${B(c.tag)}</td><td>${esc(c.sc)}</td><td>${esc(c.guide)}</td></tr>`).join('')}</table></div><h3 style="margin-top:12px">動作確認(仮)</h3><div class="bar">${SCEN.map((c,i)=>`<button class="btn s" onclick="demo(${i})">${esc(c.ch)}</button>`).join('')}</div><div id="demo" style="color:var(--mut)">選択肢を押すと、付与されるサービス区分と開始されるシナリオが表示されます。</div></div>`}
function demo(i){const c=SCEN[i];$('#demo').innerHTML=`選択「${esc(c.ch)}」→ サービス区分＝${B(c.tag)} を付与 → ${esc(c.sc)}を開始 → ${esc(c.guide)}`}
const fl=f=>E.leads.d.filter(r=>f.src?r.流入元==f.src:(f.svc=='指定なし'||r.サービス区分==f.svc));
function fcnt(f){return f.dest=='診断回答'?E.diag.d.length:(f.svc=='指定なし'&&!f.src)?'—':fl(f).length}
function editForm(i){const nw=i<0,f=nw?{n:'',d:'',dest:'リード管理',svc:'指定なし',on:'有効',q:'会社名\nお名前\nメールアドレス\n相談内容',flow:''}:FORMS[i];
 const sel=(id,o,v)=>`<select id="${id}">${o.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('')}</select>`;
 dr.innerHTML=`<div class="bar" style="justify-content:space-between"><h3>フォーム${nw?'の追加':'の設定'}</h3><button class="btn s" onclick="cl()">閉じる</button></div>${f.flow?`<div class="card"><h3>導線</h3>${esc(f.flow)}</div>`:''}<div class="card"><div class="fm"><label>フォーム名<input id="f_n" value="${esc(f.n)}"></label><label>状態${sel('f_on',['有効','無効'],f.on)}</label><label class="w">説明<input id="f_d" value="${esc(f.d)}"></label><label>保存先(既存シート)${sel('f_dest',['リード管理','診断回答'],f.dest)}</label><label>付与するサービス区分(タグ)${sel('f_svc',['指定なし',...TAGS],f.svc)}</label><label class="w">回答の識別(リード管理の「流入元」・任意)<input id="f_src" value="${esc(f.src||'')}"></label><label class="w">質問項目(1行に1項目)<textarea id="f_q" rows="7">${esc(f.q)}</textarea></label></div><small style="color:var(--mut)">保存先は既存シートから選びます。新しいシートは作りません。</small></div><div class="bar"><button class="btn" onclick="saveForm(${i})">保存(仮データ)</button><button class="btn s" onclick="cl()">キャンセル</button></div>`;ov.style.display='block'}
function saveForm(i){const n=$('#f_n').value.trim();if(!n){$('#f_n').focus();return}const f={n,d:$('#f_d').value,dest:$('#f_dest').value,svc:$('#f_svc').value,src:$('#f_src').value.trim(),on:$('#f_on').value,q:$('#f_q').value,flow:i<0?'':FORMS[i].flow};if(i<0)FORMS.push(f);else FORMS[i]=f;cl();go()}
const T={dash:'ダッシュボード',prospects:'見込み企業',leads:'リード管理',line:'LINE',mail:'メール',forms:'フォーム',diag:'経営診断',resv:'予約',deals:'商談管理',settings:'設定'};
function go(){if(!Repo.ready)return;const p=location.hash.slice(2);const k=pages[p]?p:'dash';main.innerHTML=`<h1>${T[k]}</h1>`+pages[k]();document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.dataset.p==k));window.scrollTo(0,0)}
addEventListener('hashchange',go);
async function boot(){main.innerHTML='<p style="color:var(--mut)">読み込み中…</p>';try{await Repo.load();go()}catch(e){main.innerHTML=`<div class="card"><h3>データを読み込めませんでした</h3><p style="color:var(--mut)">${esc(e.message)}</p><button class="btn" onclick="boot()">再試行</button></div>`}}
function reload(){side.classList.remove('open');boot()}
boot();
</script></body></html>
