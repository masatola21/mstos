name: Marketing Automation Cron (High Frequency Runner)

on:
  schedule:
    # 5分ごとに実行（Vercel Hobby無料プランの1日1回制限を補完し、ステップ配信の遅延を解消）
    - cron: '*/5 * * * *'
  workflow_dispatch: # GitHub UIからの手動トリガー実行にも対応

jobs:
  trigger-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Marketing Automation Cron Endpoint
        env:
          APP_URL: ${{ secrets.PUBLIC_APP_URL || secrets.VERCEL_URL || 'https://mstcorp.info' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # URLの末尾スラッシュを削除
          TARGET_URL="${APP_URL%/}/api/cron/marketing-automation"
          echo "Triggering: ${TARGET_URL}"

          # CRON_SECRETが設定されている場合はBearerヘッダーを付与
          if [ -n "$CRON_SECRET" ]; then
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              "${TARGET_URL}")
          else
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Content-Type: application/json" \
              "${TARGET_URL}")
          fi

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status Code: ${HTTP_CODE}"
          echo "Response Body: ${BODY}"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Successfully executed marketing automation cron."
          else
            echo "Marketing automation cron returned non-200 status code: ${HTTP_CODE}"
            exit 1
          fi
